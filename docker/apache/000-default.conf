# Apache di dalam container.
#
# Nginx (host VPS) meneruskan request TANPA prefix /app-tamu, tetapi
# container juga menerima prefix tersebut bila diakses langsung
# (mis. http://127.0.0.1:8081/app-tamu/) untuk pengujian sebelum Nginx
# dikonfigurasi.
#
# Pendekatan:
# - Alias /app-tamu -> public/ : file statis ber-prefix (CSS/JS) dipetakan
#   langsung ke public/.
# - Per-directory mod_rewrite : URL yang tidak cocok dengan file/direktori
#   (mis. /api/v1/health) diarahkan ke front controller public/index.php.
#   Pola standar yang sama dengan framework PHP pada Apache.

<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/html/public

    Alias /app-tamu /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
